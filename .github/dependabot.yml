# Dependency updates (EPIC 38, #71). Weekly, grouped, into develop.
#
# Why grouped and capped: every PR costs a CodeRabbit review, and the repo's
# free plan gets roughly one an hour — a PR per dependency would starve real
# work. One grouped PR per ecosystem a week is reviewable in one sitting.
#
# Why the toolchain only gets patches: Kotlin, Compose Multiplatform (and
# JetBrains' androidx forks that ship with it) and AGP move in lockstep. A
# lone minor bump of any one of them breaks the build or, worse, only the
# wasmJs/iOS targets. Those bumps are done by
# hand, together, in their own PR (#192 is the pattern).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      toolchain-patches:
        patterns:
          # The compiler and stdlib, and the Gradle plugin markers
          # (org.jetbrains.kotlin.multiplatform, .plugin.compose, …) — but not
          # kotlinx or kotlin-wrappers, which are libraries.
          - org.jetbrains.kotlin:*
          - org.jetbrains.kotlin.*
          - org.jetbrains.compose*
          - org.jetbrains.androidx*
          - com.android*
      libraries:
        patterns:
          - "*"
    ignore:
      - dependency-name: org.jetbrains.kotlin:*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: org.jetbrains.kotlin.*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: org.jetbrains.compose*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: org.jetbrains.androidx*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: com.android*
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns:
          - "*"

  # The landing (muvissapp.com) and the web database worker, which is a local
  # npm package bundled into the web app (CLAUDE.md, "Web + DB").
  - package-ecosystem: npm
    directories:
      - /website
      - /core/database/src/webWorker
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns:
          - "*"

  # fastlane, for the store uploads.
  - package-ecosystem: bundler
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    groups:
      bundler:
        patterns:
          - "*"

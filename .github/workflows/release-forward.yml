name: Forward a fix

# A PR merged into release/X.Y.Z or hotfix/X.Y.Z is opened again, as the release
# App, into every newer open release/* branch and into develop, each linking the
# original (ADR 0030), so a fix made on an older line is not lost from the next
# release. A forward PR whose cherry-pick conflicts is still opened, empty, and
# stays open for a person (scripts/release/forward-fix.sh).
#
# The App, not GITHUB_TOKEN: it pushes the forward branches, and the PRs it opens
# need CI runs and must start release-milestone.yml. A forward PR is not
# forwarded again: its original already went to every line.
#
# pull_request_target, so a fix merged from a fork is forwarded too (a fork's
# pull_request run gets no secrets, so no App token). It runs only on a merge,
# and what it checks out is the merge commit: code already accepted into the
# release branch, never an unmerged PR head.
on:
  pull_request_target:
    branches: [ 'release/**', 'hotfix/**' ]
    types: [ closed ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forward:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint a release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # A forward PR is one this release App opened from a forward/ branch of this
      # repository: its original already went to every line. Anything else, a
      # fork's or another bot's branch of the same name included, is a fix. The
      # App's login is only known once its token is minted, so this is a step.
      - name: Is this the App's own forward PR
        id: own
        env:
          SLUG: ${{ steps.app.outputs.app-slug }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" == forward/* && "$HEAD_REPO" == "$REPO" && "$AUTHOR" == "${SLUG}[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A forward PR from ${SLUG}[bot]; its original was already forwarded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Keeps the App's credentials, which the forward branches are pushed with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
        if: steps.own.outputs.skip != 'true'

      - name: Commit as the release App
        if: steps.own.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          USER_ID="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: Forward the fix to the newer lines and develop
        if: steps.own.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SOURCE: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: scripts/release/forward-fix.sh all "$PR" "$SOURCE" "$MERGE_SHA"

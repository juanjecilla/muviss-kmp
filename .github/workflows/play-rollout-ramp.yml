name: Play rollout ramp

# Takes a staged production rollout from 20% to 100% without anyone clicking
# (ADR 0025): day 0 → 20% (set by release.yml's promote), day 2 → 50%,
# day 4 → 100%, counted from the release tag. The policy is
# fastlane/play_rollout.rb and only ever raises the fraction, and never while
# Sentry shows a new crash in the release (fastlane/sentry_gate.rb, #193).
#
# To stop it, halt the release: `gh workflow run play-promote.yml -f action=halt`.
# The ramp leaves a halted release alone until someone runs `resume`.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: play-promote
  cancel-in-progress: false

permissions:
  contents: read
  # Closing the release issue at 100% (release-promote.yml's `complete`).
  issues: write

jobs:
  ramp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ramp is timed from the newest vX.Y.Z tag's date.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Raise the rollout if it is due
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # The crash gate (#193): a raise waits while Sentry shows a new
          # unhandled issue in this release, or cannot be asked. The token
          # needs event:read (org:read) on top of what mapping uploads use.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          # The ramp writes this file when it reaches 100% (the Fastfile's ramp lane).
          RAMP_RESULT_FILE: ${{ runner.temp }}/ramp-result.txt
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; nothing to ramp."
            exit 0
          fi
          if ! git tag -l 'v[0-9]*' | grep -qv -- '-'; then
            echo "::notice::No release tag yet; nothing to ramp."
            exit 0
          fi
          rm -f "$RAMP_RESULT_FILE"
          bundle exec fastlane android ramp

      # ADR 0030: a version whose rollout reached 100% is finished, so its
      # "Release X.Y.Z" issue closes. Only the newest tag can be ramping.
      - name: Close the release issue at 100%
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAMP_RESULT_FILE: ${{ runner.temp }}/ramp-result.txt
        run: |
          [ -s "$RAMP_RESULT_FILE" ] || exit 0
          VERSION="$(git tag -l 'v[0-9]*' | grep -v -- '-' | sort -V | tail -1 | sed 's/^v//')"
          ruby fastlane/release_promote.rb complete "$VERSION"

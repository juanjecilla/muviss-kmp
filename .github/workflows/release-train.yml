name: Release train

# The weekly cut (ADR 0025, staged by ADR 0030). Once a week, at night, cut
# release/X.Y.Z from develop when develop has commits since the last release —
# the version bumped from the conventional commits (scripts/release/next-version.sh).
# Pushing the branch starts release-rc.yml, so the candidate is on Play's
# internal track by morning. Each cut also gets a milestone X.Y.Z and a
# "Release X.Y.Z" issue carrying its schedule (scripts/release/release-issue.sh).
#
# Skips, writing why to the run summary:
#   - nothing new on develop since the last vX.Y.Z;
#   - a version is still in internal (ADR 0030): the new RC would replace it on
#     that one track. A version past internal (open beta, ramping in production)
#     does not stop the cut. That case also comments on a "Release train
#     blocked" issue so it is seen.
#
# A release branch with no release issue is adopted: its issue is created with
# the cut date taken from its first commit, and it counts as internal until its
# issue says otherwise. A branch cut before staged releases existed (no
# scripts/release/version-code.sh in it) is not: it holds the train until it is
# shipped by hand with the Ship release workflow.
#
# The cron fires every night; the job runs on the day in the repo variable
# RELEASE_TRAIN_DAY (ISO weekday, 1 = Monday, the default), so the day can move
# without editing this file. The hour is the cron's: 23:00 UTC. Dispatch runs
# regardless of the day.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is it train day?
        id: day
        env:
          TRAIN_DAY: ${{ vars.RELEASE_TRAIN_DAY || '1' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$(date -u +%u)" != "$TRAIN_DAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN cannot do this job: a branch it pushes starts no workflow,
      # so release-rc.yml would never run, and an issue it opens does not start
      # the workflows that watch for them.
      - name: Mint a release App token
        id: app
        if: steps.day.outputs.run == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.day.outputs.run == 'true'
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Commit as the release App
        if: steps.day.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          USER_ID="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: Cut the release branch
        if: steps.day.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scripts/release/release-issue.sh labels

          # Adopt an open release branch that has no release issue yet, unless it
          # was cut before staged releases: its RCs carry commit-count
          # versionCodes and its own release.yml promotes internal → production
          # behind the approval, so the Sunday step cannot walk it. It ships by
          # hand (Ship release), and the train waits for it.
          PLAN="$(scripts/release/release-issue.sh plan)"
          LEGACY=""
          for v in $(jq -r '.adopt[]' <<<"$PLAN"); do
            git fetch --quiet origin "release/$v"
            if ! git cat-file -e "FETCH_HEAD:scripts/release/version-code.sh" 2>/dev/null; then
              LEGACY="$LEGACY $v"
              continue
            fi
            scripts/release/release-issue.sh ensure "$v" "$(scripts/release/release-issue.sh cut-date "$v")"
          done

          # The stagger rule (ADR 0030): a version still in internal holds the cut.
          HOLD="$(jq -r '.hold // empty' <<<"$PLAN")"
          for v in $LEGACY; do
            HOLD="${HOLD:+$HOLD; }release/$v predates staged releases: ship it with the Ship release workflow (or close the branch), and the train cuts after it"
          done
          if [ -n "$HOLD" ]; then
            MSG="Release train $(date -u +%F): skipped — $HOLD."
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            ISSUE="$(gh issue list --state open --search 'in:title "Release train blocked"' --json number --jq '.[0].number')"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "$MSG"
            else
              gh issue create --title "Release train blocked" --body "$MSG"
            fi
            exit 0
          fi

          set +e
          VERSION="$(scripts/release/next-version.sh origin/develop)"
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "Release train $(date -u +%F): nothing new on develop since the last release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$CODE" -eq 0 ] || exit "$CODE"

          # --stagger-checked: the hold above is the stagger rule; start-release.sh
          # would otherwise refuse while any release branch is open.
          scripts/release/start-release.sh "$VERSION" --stagger-checked
          scripts/release/release-issue.sh ensure "$VERSION"
          echo "Release train $(date -u +%F): cut \`release/$VERSION\`, milestone and issue created." >> "$GITHUB_STEP_SUMMARY"

          # A blocked-train issue is resolved once a train runs again.
          ISSUE="$(gh issue list --state open --search 'in:title "Release train blocked"' --json number --jq '.[0].number')"
          [ -z "$ISSUE" ] || gh issue close "$ISSUE" --comment "Unblocked: cut release/$VERSION."

name: Dependency review

# What a pull request ADDS to the dependency graph (Gradle, npm, bundler, Actions),
# checked against GitHub's advisory database (#479). Dependabot alerts cover what
# is already shipped; this stops a vulnerable or copyleft dependency at the door.
#
# Licences: the Android release has its own allow-list in `licensee`
# (Apache-2.0, MIT, BSD-3-Clause), which is the strict check. This one covers
# every ecosystem, including the website's and CI tooling's dev dependencies, whose
# permissive licences (ISC, BSD-2-Clause, 0BSD...) the Android list was never meant
# to judge, so it denies strong copyleft (GPL, AGPL) instead of allow-listing. Weak
# copyleft passes here on purpose: the website's build already uses Astro's
# `lightningcss` (MPL-2.0) and `sharp`'s libvips binaries (LGPL-3.0-or-later), and
# shipped Android code still has to clear `licensee`.
on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependencies added by this PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The default is runtime only, which would wave a dev dependency through both checks.
          fail-on-scopes: runtime, development, unknown
          # Every version of both families: SPDX has no wildcard, so an omitted id passes.
          deny-licenses: GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: never

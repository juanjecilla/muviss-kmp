name: Release

# A release or hotfix branch merged into main is a release (ADR 0025):
#
#   tag            vX.Y.Z on the merge commit; delete the merged branch
#   promote        on a manual merge: the RC (from beta, or internal if it never
#                  went to beta) → production at 20%, behind the `production`
#                  environment. The scheduled path (labelled auto-release) is
#                  promoted by the Sunday step itself (ADR 0030).
#                  play-rollout-ramp.yml takes it to 100% from there.
#   desktop        DMG / DEB / MSI built from the tag
#   github-release the RC's own AAB (never rebuilt) + the desktop installers
#   back-merge     a PR main → develop, so develop sees the tag and any fix
#                  made on the release branch
#
# Dispatch it by hand to exercise the AAB and installer builds without
# releasing anything: no tag, no upload, no Release.
on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      rc_tag: ${{ steps.tag.outputs.rc_tag }}
      rc_version_code: ${{ steps.tag.outputs.rc_version_code }}
    steps:
      - name: Check for the release App
        id: has-app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: echo "ok=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mint a release App token
        id: app
        if: steps.has-app.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Tag the release
        id: tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION="${HEAD_REF#*/}"
          TAG="v$VERSION"
          RC_TAG="$(git tag -l "$TAG-rc*" | sort -V | tail -1)"
          [ -n "$RC_TAG" ] || { echo "::error::no release candidate was ever built for $VERSION (no $TAG-rc* tag); nothing to promote"; exit 1; }
          # Before any ref changes: an RC the formula cannot encode stops the job
          # here, not after the tag is pushed and the branch deleted.
          RC_VERSION_CODE="$(scripts/release/version-code.sh "$RC_TAG")"
          # The merge must ship what the candidate was: if the branch moved
          # after its last RC, that newer code was never on a tester's phone.
          [ "$(git rev-parse "$RC_TAG^{commit}")" = "$(git rev-parse "origin/$HEAD_REF" 2>/dev/null || git rev-parse "$MERGE_SHA^2")" ] \
            || echo "::warning::$HEAD_REF moved after $RC_TAG; production gets $RC_TAG, not the branch head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Muviss $VERSION" "$MERGE_SHA"
          git push origin "$TAG"
          # The train cuts nothing while a release branch exists.
          git push origin --delete "$HEAD_REF" || echo "::notice::$HEAD_REF was already deleted"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "rc_tag=$RC_TAG"
            echo "rc_version_code=$RC_VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "### Released \`$TAG\` (promoting \`$RC_TAG\`)" >> "$GITHUB_STEP_SUMMARY"

  # The manual path: a person merged the release PR (ship-release or by hand).
  # Required reviewers on the `production` environment are the last human gate
  # before users get the build (scripts/release/owner-setup.sh configures them).
  promote:
    needs: tag
    if: needs.tag.result == 'success' && !contains(github.event.pull_request.labels.*.name, 'auto-release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Promote the beta RC to production (20%)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          VERSION_CODE: ${{ needs.tag.outputs.rc_version_code }}
          VERSION: ${{ needs.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the promotion."
            exit 0
          fi
          # A manual merge may ship an RC that never went to beta (a hotfix, or
          # ahead of its Sunday): the lane then takes it from internal.
          bundle exec fastlane android promote rollout:0.2 "version_code:$VERSION_CODE" allow_internal:true
          # The release issue says so too (ADR 0030); a no-op without one.
          ruby fastlane/release_promote.rb record-production "$VERSION"

  # The scheduled path (ADR 0030) is not promoted here: release-promote.yml's
  # Sunday step merged the PR as the release App (labelled auto-release) and
  # promotes beta → production itself, in the same run and before any newer
  # version takes the beta track, so the two can never race for it.

  # On dispatch, build the AAB alone (no upload) so the release path can be
  # exercised without a version.
  android-dispatch:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-release-build.yml
    with:
      ref: ${{ github.ref }}
      release_tag: dispatch-${{ github.run_number }}
      upload_internal: false
    secrets: inherit

  # EPIC 12 (issue #14): native desktop installers, one job per OS/format —
  # jpackage's backends only run on the OS they target, which is why this is a
  # matrix of jobs rather than one job running three tasks. `fail-fast: false`
  # means a broken MSI leg does not take the DMG and DEB down with it. Every
  # installer is unsigned/unnotarized (#39, #179).
  desktop-release:
    needs: tag
    if: always() && (needs.tag.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: :app:desktopApp:packageDeb
            artifactPath: app/desktopApp/build/compose/binaries/main/deb/*.deb
          - os: macos-latest
            task: :app:desktopApp:packageDmg
            artifactPath: app/desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: :app:desktopApp:packageMsi
            artifactPath: app/desktopApp/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # packageVersion comes from the exact tag (app/desktopApp/build.gradle.kts).
          ref: ${{ needs.tag.outputs.tag || github.ref }}
          fetch-depth: 0

      # The JDK gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # (Corretto 21), as JAVA_HOME: Gradle then runs the daemon on it as-is
      # instead of downloading one through foojay, whose package IDs are retired
      # when Corretto updates and then answer 400 (2026-10-06). The daemon was
      # already this JDK — that download is where it came from — so builds,
      # tests and the desktop runtime image are unchanged.
      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build desktop installer
        env:
          # The v4 read token keeps the credential out of request URLs and wins
          # when set; the v3 key is the fallback (CLAUDE.md, #91, #197).
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Remote config (EPIC 45, ADR 0026). Blank = defaults only, no request ever
          # made; the secret is set when the owner has created the ConfigCat product.
          CONFIGCAT_SDK_KEY: ${{ secrets.CONFIGCAT_SDK_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Pinned rather than left to the task-name heuristic in
          # app/shared/build.gradle.kts (#110): none of the package tasks match
          # it, so a desktop release's crash reports would file under
          # "development".
          SENTRY_ENVIRONMENT: production
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muviss-desktop-${{ matrix.os }}-${{ needs.tag.outputs.tag || github.run_number }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  # Issue #45: a real GitHub Release, not only workflow artifacts. `needs` the
  # desktop jobs, so a failed leg stops the release rather than publishing a
  # partial one. The AAB is the RC's own, from its pre-release (release-rc.yml).
  github-release:
    needs: [tag, desktop-release]
    if: needs.tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40 # up to ~25 waiting for a still-running RC workflow
    permissions:
      contents: write
      actions: read # which RC run uploaded to TestFlight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Download the desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: muviss-desktop-*
          merge-multiple: true

      - name: Download the RC's AAB
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.tag.outputs.rc_tag }}
        run: gh release download "$RC_TAG" --pattern '*.aab' --dir artifacts

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          RC_TAG: ${{ needs.tag.outputs.rc_tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          PREV="$(git tag -l 'v[0-9]*' | grep -v -- '-' | sort -V | grep -B1 -x "$TAG" | head -1)"
          [ "$PREV" = "$TAG" ] && PREV=""
          # The RC's iOS job skips without the Apple setup and can fail on its own, so
          # say TestFlight only when its upload step succeeded for this RC's commit.
          # IOS_UPLOAD: success | none (every run finished without an upload) |
          # unknown (a lookup failed, or a run was still going after ~25 minutes).
          RC_SHA="$(git rev-list -n 1 "$RC_TAG")"
          IOS_UPLOAD=none
          if ! RUNS="$(gh run list --workflow release-rc.yml --commit "$RC_SHA" --json databaseId --jq '.[].databaseId')"; then
            IOS_UPLOAD=unknown
            RUNS=""
          fi
          for RUN in $RUNS; do
            STATUS=""
            for _ in $(seq 1 50); do
              STATUS="$(gh run view "$RUN" --json status --jq .status)" || { STATUS=""; break; }
              [ "$STATUS" = "completed" ] && break
              sleep 30
            done
            if [ "$STATUS" != "completed" ]; then IOS_UPLOAD=unknown; continue; fi
            if ! STEP="$(gh run view "$RUN" --json jobs --jq '.jobs[] | select(.name == "ios") | .steps[] | select(.name == "Archive and upload to TestFlight (internal)") | .conclusion')"; then
              IOS_UPLOAD=unknown
              continue
            fi
            if [ "$STEP" = "success" ]; then IOS_UPLOAD=success; break; fi
          done
          {
            echo "Muviss ${TAG}."
            echo
            if [ -f "fastlane/release-notes/$TAG/en-US.txt" ]; then cat "fastlane/release-notes/$TAG/en-US.txt"; echo; fi
            echo "### Downloads"
            echo
            echo "- **Android** — on Google Play, rolling out in stages. The \`.aab\` here"
            echo "  is $RC_TAG, the exact bundle promoted to production (not installable directly)."
            echo "- **Desktop** — \`.dmg\` (macOS), \`.deb\` (Linux), \`.msi\` (Windows)."
            echo "  All three are **unsigned and un-notarized** (#39): macOS Gatekeeper"
            echo "  will refuse the DMG until it is opened via right-click > Open, and"
            echo "  Windows SmartScreen will warn (#179)."
            case "$IOS_UPLOAD" in
              success) echo "- **iOS** — on TestFlight (internal) as the same candidate, uploaded by the release-candidate workflow's iOS job. Nothing is rebuilt here, and App Store submission is a separate step (ADR 0033)." ;;
              none) echo "- **iOS** — no build for this version: the release-candidate workflow did not upload $RC_TAG to TestFlight." ;;
              *) echo "- **iOS** — whether $RC_TAG reached TestFlight could not be verified when these notes were written; see the release-candidate workflow's iOS job." ;;
            esac
            echo
            echo "### Not in this build"
            echo
            echo "Sync is compiled out. The four flags that enable it are deliberately"
            echo "absent from release builds, so no library data leaves the device"
            echo "(ADR 0018)."
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > notes.md
          gh release create "$TAG" --title "Muviss $TAG" --notes-file notes.md \
            --verify-tag --latest artifacts/*

  back-merge:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A PR opened with GITHUB_TOKEN would get no CI run, and so could never
      # satisfy develop's required checks; the App's token does not have that
      # problem. Without the App, the PR still opens and CI must be re-run by hand.
      - name: Check for the release App
        id: has-app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: echo "ok=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mint a release App token
        id: app
        if: steps.has-app.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Open the back-merge PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          BRANCH="back-merge/$TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore(release): back-merge $TAG into develop" \
            --label no-landing \
            --body "$(printf '%s\n\n%s\n\n%s' \
              "Brings \`$TAG\` (and anything fixed on its release branch) back into \`develop\`, so the train measures the next release from this tag (ADR 0025)." \
              "**Merge with a merge commit, not a squash** — a squash would copy the release's changes without the history, and the next release PR into main would conflict with itself." \
              "If it conflicts, resolve it on \`$BRANCH\`.")" \
            || gh pr create --base develop --head "$BRANCH" \
              --title "chore(release): back-merge $TAG into develop" \
              --body "Brings \`$TAG\` back into \`develop\` (ADR 0025). **Merge with a merge commit, not a squash.**"

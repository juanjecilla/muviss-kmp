name: Release

# Manual, tag-triggered release build. Produces a signed AAB and uploads it
# as a workflow artifact — there is no Play publishing step yet (see
# docs/RELEASING.md); the first release is uploaded to the Play Console by
# hand. Push a `vX.Y.Z` tag to run this.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: versionCode/versionName are derived from
          # `git rev-list --count` / `git describe` (see
          # app/androidApp/build.gradle.kts) and need real git metadata,
          # not the single commit a shallow checkout would give us.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Optional: both features degrade gracefully to no-op when their
          # secret isn't configured (see ADR 0007 / docs/RELEASING.md).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew :app:androidApp:bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: muviss-release-${{ github.ref_name }}
          path: app/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

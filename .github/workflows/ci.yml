name: CI

# Git flow (ADR 0025): day-to-day PRs target `develop`; only `release/*` and
# `hotfix/*` PRs target `main`. Pushes to the long-lived branches run too: they
# are what every release is cut from.
on:
  push:
    branches: [ main, develop, 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every lane below is gated on this one, because the expensive lane is not
  # Linux. `ios` runs on macOS, which GitHub bills at 10x: 8m31s of Kotlin/Native
  # linking plus an Xcode build is ~130 billed minutes per run, and over the 30
  # days to 2026-09-09 this one job spent 1,590 of the account's 3,194 billed
  # minutes. Half the bill, one job.
  #
  # So it is worth ~1 Linux minute to ask whether the change can possibly affect
  # a target before paying for it. Measured against the 14 PRs in that window
  # this skips 2 of them — a docs-only PR and a .gitignore PR. That is a modest
  # 14%, not a transformation, and it is listed last among this file's cost
  # changes for that reason. It earns its place because the two it skips cost
  # ~180 billed minutes between them and the guard costs ~14.
  #
  # Plain git rather than a paths-filter action: the comparison is two lines,
  # and this keeps a third-party action off the critical path of every PR.
  #
  # Pushes are never filtered — to `main`, `develop` or a release branch. They
  # are the last line of defence and far rarer than PR pushes (4 against 14 PRs
  # in the window above), so the saving would be noise and the risk would not.
  changes:
    name: Which lanes need running
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The three-dot diff below needs the merge base, so the default
          # single-commit checkout is not enough.
          fetch-depth: 0

      - name: Decide which lanes the diff can affect
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail

          run_everything() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request; running every lane."
            run_everything
          fi

          # Fail open. A guard that silently skips the build because it could
          # not work out the diff is worse than one that costs a few minutes.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD") || {
            echo "::warning::Could not diff against origin/${BASE_REF}; running every lane."
            run_everything
          }
          if [ -z "$changed" ]; then
            echo "::warning::Empty diff against origin/${BASE_REF}; running every lane."
            run_everything
          fi

          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Anything the shared Kotlin/Native framework or the Xcode project can
          # see. `core`, `feature` and `models` are in here because :app:shared
          # depends on them, so a change there does reach the iOS link. This
          # file is in here too: a PR that edits CI must run the CI it edits.
          IOS_PATHS='^(app/shared/|app/iosApp/|core/|feature/|models/|build-logic/|gradle/|config/)|\.gradle\.kts$|^gradle\.properties$|^settings\.gradle\.kts$|^\.github/workflows/ci\.yml$'
          # Everything above, plus the platforms iOS cannot see but `build`,
          # `desktop` and `web-tests` can.
          CODE_PATHS="${IOS_PATHS}"'|^(app/androidApp/|app/desktopApp/|app/webApp/|server/|supabase/|scripts/)'

          if echo "$changed" | grep -qE "$IOS_PATHS"; then ios=true; else ios=false; fi
          if echo "$changed" | grep -qE "$CODE_PATHS"; then code=true; else code=false; fi

          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Lanes -> code=$code ios=$ios"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Nothing here has ever legitimately approached this. The point is the
    # ceiling, not the number: the default is 360 minutes, and a job that hangs
    # rather than fails burns all of it.
    timeout-minutes: 45
    steps:
      # Full history: the release build below takes its versionCode from
      # `git rev-list --count HEAD` and refuses a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The JDK gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # (Corretto 21), as JAVA_HOME: Gradle then runs the daemon on it as-is
      # instead of downloading one through foojay, whose package IDs are retired
      # when Corretto updates and then answer 400 (2026-10-06). The daemon was
      # already this JDK — that download is where it came from — so builds,
      # tests and the desktop runtime image are unchanged.
      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless (format check)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Detekt (static analysis)
        run: ./gradlew detekt --stacktrace

      # Every jvmTest task in the build, resolved by name rather than listed.
      # This used to be a hand-maintained allowlist, which meant a module
      # missing from it was a module whose tests never ran — and modules kept
      # going missing. :core:sync and :core:database were both absent for a
      # while, so every sync and migration test written since EPIC 9 had only
      # ever run on a developer's machine. By the time this was replaced, all
      # six :domain modules, :feature:collection:*, :core:common and :models
      # were in the same position: roughly fifty test files, none of them run
      # here. That is issue #25.
      #
      # Anything in commonTest is still verified on exactly one platform, since
      # the JVM is where Skiko ships and so where all Compose and golden-image
      # tests execute. Golden images are compared, not just recorded: MuvissTheme
      # sets a bundled font on every text style, so a screenshot matches a
      # developer's machine bar antialiasing, which the tolerance absorbs.
      #
      # :app:androidApp's testDebugUnitTest is named separately: an Android
      # application module has no jvmTest task to match, and its tests
      # (widget mapper, notification worker) ran nowhere (#67).
      - name: Unit tests (JVM)
        run: >
          ./gradlew
          jvmTest
          :app:androidApp:testDebugUnitTest
          --continue
          --stacktrace

      # Golden-image failures are only readable as pictures: the harness writes
      # the actual capture and a magenta-marked diff next to each other, and
      # without them a red run says nothing but "pixels moved".
      - name: Upload test reports and golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            /tmp/muviss-goldens/**

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration --stacktrace

      # The check reads the APK it just built: Compose Resources missing from
      # the package pass every JVM test and only crash on a device (#165).
      - name: Assemble Android debug APK
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:verifyDebugApkComposeResources --stacktrace

      # Lint covers the app and, through checkDependencies, every module it
      # ships that has an Android target (muviss.kmp.library applies
      # com.android.lint). JVM-only test helpers such as :core:testing are not
      # linted. Accessibility issues are errors; the
      # baseline holds only what predates lint being switched on (#164).
      - name: Android Lint
        run: ./gradlew :app:androidApp:lintDebug --stacktrace

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          if-no-files-found: ignore
          path: app/androidApp/build/reports/lint-results-debug.*

      - name: Compile web targets (JS + Wasm)
        run: ./gradlew compileKotlinJs compileKotlinWasmJs --stacktrace

      # kotlin-js-store/ pins every npm package the JS and Wasm builds resolve.
      # Kotlin's own store task does not fail on a stale lock — it rewrites the
      # file with whatever yarn just resolved — so the check is ours: resolve,
      # store, and fail if that changed anything the PR did not commit (#67).
      - name: npm lockfiles are committed and current
        run: |
          ./gradlew kotlinNpmInstall kotlinStoreYarnLock kotlinWasmNpmInstall kotlinWasmStoreYarnLock --stacktrace
          if [ -n "$(git status --porcelain -- kotlin-js-store/)" ]; then
            git status --short -- kotlin-js-store/
            git diff -- kotlin-js-store/ | head -100
            echo "::error::kotlin-js-store/ is stale. Run ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock and commit the result."
            exit 1
          fi

      # The per-target compiles above never touch the *intermediate* source
      # sets' own compilations (`webMain`, `appleMain`, `iosMain`,
      # `nativeMain`): they read those directories straight into the target.
      # A shared source set can therefore be broken — unresolved references
      # against dependencies declared only per target — with every step above
      # still green and only `./gradlew build` red. `allMetadataJar` compiles
      # each of them once. It needs no Kotlin/Native toolchain (metadata
      # klibs come from the JVM compiler), so it runs here like anywhere else.
      - name: Compile shared source sets (metadata klibs)
        run: ./gradlew allMetadataJar --stacktrace

      # R8 used to run only when a release was cut, so a missing keep rule
      # surfaced as a crash in an RC (#199). This shrinks the release build on
      # every PR (debug-signed without the keystore, which is fine here) and
      # fails if R8 wrote no mapping or reported missing classes. The licence
      # allow-list (licensee) is part of `check`, which nothing ran either.
      - name: Release build with R8, and the licence allow-list
        run: ./gradlew :app:androidApp:assembleRelease :app:androidApp:licenseeAndroidRelease --stacktrace

      - name: R8 left a mapping and no missing rules
        run: |
          test -s app/androidApp/build/outputs/mapping/release/mapping.txt
          if [ -e app/androidApp/build/outputs/mapping/release/missing_rules.txt ]; then
            cat app/androidApp/build/outputs/mapping/release/missing_rules.txt
            exit 1
          fi


  # JS and Wasm tests live in their own job for the same reason desktop does
  # (see below): `build` already assembles an Android APK, compiles both web
  # targets and builds every metadata klib, and it has died mid-`allMetadataJar`
  # from resource exhaustion before. Browser tests add a Kotlin/JS test compile
  # per module plus a headless Chrome per module on top of that. Locally, run
  # concurrently with everything else, six `:feature:*:domain` modules failed
  # `compileTestDevelopmentExecutableKotlinWasmJs` with "Internal compiler
  # error" and each one compiled fine on its own immediately afterwards. The
  # same run's `./gradlew build` then OOMed three iOS tasks with an explicit
  # `java.lang.OutOfMemoryError: Java heap space`, so it is heap exhaustion in
  # the Kotlin compiler rather than anything about this code — a load symptom,
  # and a CI runner has far less headroom than the 36 GB machine that produced
  # it. That is issue #49.
  #
  # Until EPIC 23's follow-up this job did not exist at all: CI compiled JS and
  # Wasm (it still does, in `build`, and that stays blocking) but never ran a
  # single test on either. That is the open half of #25, and it is why #24 —
  # two tests failing on js/browser since before EPIC 22 — went unnoticed for
  # months. Anything in `commonTest` is still *verified* on the JVM; what this
  # job adds is the guarantee that it does not fail somewhere else.
  #
  # Non-blocking on purpose, for now. Flipping `continue-on-error` off is the
  # goal and needs the flake above resolved first; do not flip it while a red
  # run here is expected, because a check nobody can act on is a check nobody
  # reads.
  # DEFERRED (2026-10-04): the web app's launch is postponed, so this job is
  # switched off rather than left to burn its 30-minute timeout on every PR.
  # It was non-blocking already and never green: #172 (cowatch's JS test bundle
  # cannot resolve `os`/`path`) and #49 (compiler OOM under parallel load).
  # JS and Wasm still *compile* in `build` — that is what catches commonMain
  # code a browser target cannot take (#10). To bring it back, restore
  # `if: needs.changes.outputs.code == 'true'` and fix #172 first.
  # See docs/EPICS.md, "Web is deferred".
  web-tests:
    needs: changes
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    # Non-blocking is not the same as non-hanging: `continue-on-error` keeps a
    # red run from failing the workflow, but a job that never returns still
    # holds the PR and burns the full 6h default. The whole suite is under two
    # minutes locally from a cold `--rerun-tasks` (941 tasks), so 30 minutes is
    # already several times any legitimate runtime.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The JDK gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # (Corretto 21), as JAVA_HOME: Gradle then runs the daemon on it as-is
      # instead of downloading one through foojay, whose package IDs are retired
      # when Corretto updates and then answer 400 (2026-10-06). The daemon was
      # already this JDK — that download is where it came from — so builds,
      # tests and the desktop runtime image are unchanged.
      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Nothing in this repo configures the browser: `jsBrowserTest` uses the
      # Kotlin plugin's default karma + `karma-chrome-launcher`, which resolves
      # the binary from $CHROME_BIN and otherwise guesses at a PATH name. That
      # guess is what makes it work on a developer's machine, and the name it
      # guesses differs between runner images.
      #
      # The explicit `exit 1` is the point of the step, and the first version of
      # it did not have one: a `command -v` chain that finds nothing still exits
      # this step successfully, exporting an empty CHROME_BIN, and karma then
      # hangs trying to launch "" rather than reporting anything. Fail here,
      # loudly, with the resolved path echoed so a wrong binary is visible too.
      - name: Locate headless Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome \
            || command -v google-chrome-stable \
            || command -v chromium-browser \
            || command -v chromium \
            || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::No Chrome/Chromium on PATH; karma cannot launch a browser."
            exit 1
          fi
          echo "Using $CHROME_BIN ($("$CHROME_BIN" --version 2>&1 || echo 'no --version'))"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Unit tests (JS + Wasm, headless Chrome)
        run: ./gradlew jsBrowserTest wasmJsBrowserTest --continue --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**


  # Desktop lives in its own job rather than in `build`, and not for tidiness:
  # folded into `build` these steps produced a runner that died mid-
  # `allMetadataJar` with no log and no step conclusion, 45 minutes in — the
  # signature of resource exhaustion rather than a compile error. `build`
  # already assembles an Android APK, compiles JS and Wasm and builds every
  # metadata klib; adding two jlink runtime images and a windowed app launch on
  # top was what tipped it. Split, each side gets its own runner and its own
  # Gradle daemon, they run in parallel, and a failure names which half broke.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # See `build`: the risk being bounded is a hang, not a slow build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The JDK gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # (Corretto 21), as JAVA_HOME: Gradle then runs the daemon on it as-is
      # instead of downloading one through foojay, whose package IDs are retired
      # when Corretto updates and then answer 400 (2026-10-06). The daemon was
      # already this JDK — that download is where it came from — so builds,
      # tests and the desktop runtime image are unchanged.
      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Three steps, because they fail on different things and until EPIC 23
      # only the first existed: desktop was compiled on every PR and never
      # linked, packaged or launched.
      - name: Compile desktop app
        run: ./gradlew :app:desktopApp:compileKotlin --stacktrace

      # A plain kotlinJvm module: no jvmTest, so the build job's sweep misses
      # it. Its tests include the OAuth loopback server (#67).
      - name: Desktop unit tests
        run: ./gradlew :app:desktopApp:test --stacktrace

      # Two tasks, because on Linux they produce different things and only one
      # of them is the artifact users install. `packageDistributionForCurrentOS`
      # gives the .deb; `runDistributable` builds the jlink *app image* and
      # launches it — on Linux `packageDeb` leaves no app image behind at all
      # (macOS differs, since packageDmg needs the .app), which is how the first
      # attempt at this step ended up hunting for a binary that was never there.
      #
      # jlink runs in both, and it is the only place `nativeDistributions
      # { modules(...) }` is used. Worth being precise about what that catches:
      # jlink fails on a module *name* it cannot resolve, so a typo is caught,
      # but a module genuinely needed and simply absent is not — that is a
      # NoClassDefFoundError at runtime (docs/RELEASING.md item 7). EPIC 23
      # added jdk.httpserver for the loopback sign-in server; re-deriving the
      # list with jdeps, which would close that hole, is issue #43.
      #
      # This is also the first time the DEB path runs anywhere: the
      # desktop-release job that produces it is gated on a `v*` tag, and this
      # repo has none. Note the .deb built here carries a meaningless version
      # (`1.0.1`): packageVersion falls back to `1.0.<commitCount>` when
      # untagged, and this job's checkout is shallow. That is fine for a smoke
      # artifact and wrong for a release, which is why release.yml checks out
      # with fetch-depth: 0.
      - name: Package desktop app
        run: ./gradlew :app:desktopApp:packageDistributionForCurrentOS --stacktrace

      # The step above proves jlink *obeyed* the module list. It cannot prove
      # the list is complete: jlink fails on a module name it cannot resolve,
      # so a typo dies here, but a module genuinely needed and simply absent
      # produces a perfectly good image that throws NoClassDefFoundError at
      # whatever moment a user first reaches that code. The smoke launch below
      # only walks the startup path, and jdk.httpserver is not touched until
      # someone clicks sign in.
      #
      # This re-derives what the app needs with jdeps and fails when the
      # declaration cannot supply it. Own step rather than folded into `check`
      # so a red run names the actual problem (issue #43).
      - name: Verify the jlink module list (jdeps)
        run: ./gradlew :app:desktopApp:verifyJlinkModules --stacktrace

      - name: Upload the jlink module report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlink-modules
          if-no-files-found: ignore
          path: app/desktopApp/build/reports/jlink-modules.txt

      # The one step that asks whether the app starts, and it asks it of the
      # *packaged* app rather than `./gradlew run` — `run` executes against the
      # runner's full JDK and would say nothing about the stripped runtime image
      # real users get.
      #
      # AGENTS.md's own example is EPIC 22 shipping green across six targets and
      # two thousand tests with a Koin construction cycle that crashed on the
      # first frame; no compile and no unit test can see that. Reaching the print
      # means the graph resolved, the driver opened the database and the theme
      # composed.
      #
      # xvfb because Compose Desktop needs a display even to compose once, and
      # `xvfb-run -a` picks a free server number rather than assuming :99.
      # MUVISS_EXIT_AFTER_FIRST_FRAME is an environment variable, not a `-D`:
      # Gradle does not forward system properties to the JVM it forks, so
      # `-Dmuviss...` would set it on the daemon, the app would never see it, and
      # this step would hang until the job timed out.
      - name: Smoke-launch the packaged desktop app (headless)
        env:
          MUVISS_EXIT_AFTER_FIRST_FRAME: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a ./gradlew :app:desktopApp:runDistributable --stacktrace | tee run.log
          grep -q "first frame composed" run.log

  # Everything above runs on Linux, which cannot build a single line of iOS.
  # The consequence was not theoretical: between EPIC 11 (2026-07) and this
  # job, three epics landed and the iOS app went unbuilt for two months, in
  # which time the Xcode link acquired two hard failures — `Shared` is a
  # *static* framework, so the Sentry and sqlite3 symbols its Kotlin/Native
  # cinterops leave unresolved have to be supplied by whoever links it, and
  # nothing in `app/iosApp` did. Green on every step above the whole time.
  #
  # Two steps, because they fail on different things:
  #
  # - The Gradle link catches broken `iosMain`/`appleMain` Kotlin.
  #   `allMetadataJar` above does *not*: it compiles those source sets to
  #   metadata klibs with the JVM compiler and never runs Kotlin/Native.
  # - `xcodebuild` catches everything Gradle cannot see — Swift, the
  #   hand-maintained `project.pbxproj`, Info.plist, the asset catalog, and
  #   the link settings that were the actual bug. It builds both targets,
  #   `MuvissWidget` included, since the widget links `Shared` too.
  #
  # `-sdk iphonesimulator` rather than a `-destination`: it needs no simulator
  # *runtime* to be installed, so the job does not depend on which runtimes a
  # given macOS runner image happens to ship. Signing is off — there is no
  # Apple Developer team here, and the App Group entitlement both targets
  # carry would otherwise demand a provisioning profile (`DatabaseFactory
  # .ios.kt` already falls back to NSDocumentDirectory when the entitlement
  # is missing, so an unsigned build is a real one).
  #
  # No TMDB/Sentry/Supabase secrets: `MuvissBuildConfig` degrades to empty
  # strings exactly as it does for the Android job above, and this step is
  # about linking, not about talking to anything.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    # Written when the repo was private and macOS billed at 10x, so the
    # default 360-minute ceiling was a month's allowance in one hung run. The
    # repo is public now and standard runners are free, so the ceiling is back
    # to being about a hang holding the PR. Raised from 45 when the
    # Kotlin/Native tests and the release link joined the job (#67, #50).
    timeout-minutes: 75
    steps:
      # Full history, like `build`: the release framework link below is a
      # "Release" invocation, and :app:androidApp's guard (which is configured
      # in the same build) refuses a shallow clone for one, since versionCode
      # is `git rev-list --count HEAD`. An iOS release needs it too — its
      # CFBundleVersion is the same commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The JDK gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # (Corretto 21), as JAVA_HOME: Gradle then runs the daemon on it as-is
      # instead of downloading one through foojay, whose package IDs are retired
      # when Corretto updates and then answer 400 (2026-10-06). The daemon was
      # already this JDK — that download is where it came from — so builds,
      # tests and the desktop runtime image are unchanged.
      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The single most expensive thing in this file, and it was uncached.
      # `setup-gradle` above caches ~/.gradle; Kotlin/Native keeps its platform
      # libraries and its per-dependency compiler caches in ~/.konan, which
      # nothing was preserving. kotlin.native.cacheKind is on by default for
      # debug simulator targets, so every run rebuilt those caches from cold —
      # 8m31s of linking, and at the 10x macOS rate that is ~85 billed minutes
      # per run on its own.
      #
      # Keyed on the version catalog and the build scripts because that is what
      # decides which Kotlin/Native version and which dependency set the caches
      # belong to. The restore-key prefix means a build-script edit warm-starts
      # from the previous cache rather than falling back to cold.
      - name: Cache Kotlin/Native toolchain and compiler caches
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Link Kotlin/Native framework (iOS simulator)
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Every module's tests on Kotlin/Native (#67). The JVM runs commonTest
      # everywhere else; this is what catches what only K/N rejects — a comma
      # in a backticked test name, a JVM-only API in commonMain — which used to
      # surface only in a local `./gradlew build`. Its first local run also
      # found 43 tests that passed on CI's English runner and failed on a
      # Spanish Mac, now pinned in muviss.kmp.compose.
      #
      # The heap: the K/N compiler runs inside the Gradle daemon and OOMs at
      # the 4 GiB gradle.properties sets for ~16 GB Linux runners (#49). This
      # runner has 7 GB, so 5 GiB with two workers, raised here rather than
      # in gradle.properties.
      - name: Kotlin/Native tests (iOS simulator)
        run: >
          ./gradlew iosSimulatorArm64Test
          -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8"
          --max-workers=2
          --continue
          --stacktrace

      - name: Upload Kotlin/Native test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/iosSimulatorArm64Test/**
            **/build/test-results/iosSimulatorArm64Test/**

      # The configuration TestFlight and the App Store use, which nothing
      # linked before (#50). It runs optimisation passes the debug link never
      # reaches — devirtualisation is where it OOMed in #50 — so a release-only
      # failure would otherwise first appear while shipping.
      - name: Link the release framework (iOS simulator)
        run: >
          ./gradlew :app:shared:linkReleaseFrameworkIosSimulatorArm64
          -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8"
          --max-workers=2
          --stacktrace

      - name: Build the Xcode project
        run: >
          xcodebuild
          -project app/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build

      # packageDmg used to run here, riding the macOS runner this job already
      # pays for. It was costing 2m30s — 25 billed minutes at the 10x macOS
      # rate, ~275 a month — and nothing consumed what it produced: no step
      # uploaded the DMG, so it was built and thrown away on every pull request.
      #
      # The argument for it was real and is worth keeping in view: jpackage
      # delegates to the host OS's packaging tools, so a DMG cannot be
      # cross-compiled from Linux, and release.yml's desktop-release job — which
      # does build and upload it — is gated on a `v*` tag this repo has never
      # had. Removing this step therefore does leave DMG packaging unexercised
      # until the first tag.
      #
      # That is accepted rather than overlooked. The exposure is one Gradle task
      # on a path with no users yet, and it is checkable on demand without
      # paying for it on every PR:
      #
      #   gh workflow run release.yml -R juanjecilla/muviss-kmp
      #
      # If the DMG ever needs a standing check, it belongs on the tag path in
      # release.yml — where the artifact is kept — and not here.

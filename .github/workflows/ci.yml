name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless (format check)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Detekt (static analysis)
        run: ./gradlew detekt --stacktrace

      # Includes every module that renders Compose in a test. Golden images are
      # compared here, not just recorded: MuvissTheme sets a bundled font on
      # every text style, so a screenshot is the same on this runner as on a
      # developer's machine bar antialiasing, which the tolerance absorbs.
      #
      # This is an allowlist, so a module missing from it is a module whose
      # tests never run. :core:sync and :core:database were both absent —
      # every sync and migration test written since EPIC 9 had only ever run
      # on a developer's machine.
      - name: Unit tests (JVM)
        run: >
          ./gradlew
          :core:model:jvmTest
          :core:designsystem:jvmTest
          :core:testing:jvmTest
          :core:billing:jvmTest
          :core:database:jvmTest
          :core:sync:jvmTest
          :feature:search:data:jvmTest
          :feature:search:ui:jvmTest
          :feature:triage:ui:jvmTest
          :feature:profile:data:jvmTest
          :feature:progress:data:jvmTest
          :feature:settings:data:jvmTest
          :server:test
          --continue
          --stacktrace

      # Golden-image failures are only readable as pictures: the harness writes
      # the actual capture and a magenta-marked diff next to each other, and
      # without them a red run says nothing but "pixels moved".
      - name: Upload test reports and golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            /tmp/muviss-goldens/**

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :app:androidApp:assembleDebug --stacktrace

      - name: Compile desktop app
        run: ./gradlew :app:desktopApp:compileKotlin --stacktrace

      - name: Compile web targets (JS + Wasm)
        run: ./gradlew compileKotlinJs compileKotlinWasmJs --stacktrace

      # The per-target compiles above never touch the *intermediate* source
      # sets' own compilations (`webMain`, `appleMain`, `iosMain`,
      # `nativeMain`): they read those directories straight into the target.
      # A shared source set can therefore be broken — unresolved references
      # against dependencies declared only per target — with every step above
      # still green and only `./gradlew build` red. `allMetadataJar` compiles
      # each of them once. It needs no Kotlin/Native toolchain (metadata
      # klibs come from the JVM compiler), so it runs here like anywhere else.
      - name: Compile shared source sets (metadata klibs)
        run: ./gradlew allMetadataJar --stacktrace

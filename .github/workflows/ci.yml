name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless (format check)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Detekt (static analysis)
        run: ./gradlew detekt --stacktrace

      - name: Unit tests (JVM)
        run: >
          ./gradlew
          :core:model:jvmTest
          :feature:search:data:jvmTest
          :feature:search:ui:jvmTest
          :server:test
          --stacktrace

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :app:androidApp:assembleDebug --stacktrace

      - name: Compile desktop app
        run: ./gradlew :app:desktopApp:compileKotlin --stacktrace

      - name: Compile web targets (JS + Wasm)
        run: ./gradlew compileKotlinJs compileKotlinWasmJs --stacktrace

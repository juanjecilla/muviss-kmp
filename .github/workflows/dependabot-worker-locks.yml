name: Dependabot worker locks

# Dependabot bumps core/database/src/webWorker/package.json (sql.js, #618), but it
# cannot run Gradle, so the two kotlin-js-store locks that record that version
# (kotlin-js-store/yarn.lock and kotlin-js-store/wasm/yarn.lock) stay stale and
# `kotlinStoreYarnLock` fails the PR (#631, #638). This workflow regenerates them
# with the same tasks a developer runs by hand and pushes the result onto the
# Dependabot branch, so the bump arrives green.
#
# Two jobs, split by secrets (the same reason as release.yml's split):
#
#   regenerate  holds NO secrets and read-only permissions. It checks out the PR
#               head, runs the Gradle tasks (which execute the PR's build scripts),
#               and uploads the two lock files as an artifact. Nothing it runs can
#               reach the release App's credentials.
#   push        holds the release App's credentials, which Dependabot-triggered runs
#               can read only because they are Dependabot secrets (RELEASE_APP_ID and
#               RELEASE_APP_PRIVATE_KEY, under Settings > Dependabot). It executes NO
#               repository code: it downloads the artifact into RUNNER_TEMP (outside
#               the workspace), accepts only the two expected lock files, copies them
#               in and commits. The only programs it runs are git and its own shell.
#
# The push is made with the App's token, not GITHUB_TOKEN, because a push by
# GITHUB_TOKEN does not start new workflow runs: CI would never run on the lock
# commit. A push by the App does, so the PR re-checks with the locks in place.
#
# Dependabot stops rebasing or updating a PR once someone other than Dependabot
# has pushed to its branch. That is the price of this workflow. See docs/RELEASING.md
# "Dependabot's worker bumps" for what a maintainer does when a bump needs another
# rebase.
#
# Gate: only PRs authored by Dependabot, on a `dependabot/npm_and_yarn/` branch,
# from this repository (not a fork). The push's own run is by the App, so the
# `github.actor` check skips it and the workflow cannot loop on itself.
on:
  pull_request:
    branches: [ develop ]
    paths:
      - core/database/src/webWorker/package.json

permissions:
  contents: read

# Not cancelled mid-run: cancelling `push` between its commit and its push would
# leave a half-finished write behind. Runs queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate the worker's kotlin-js-store locks
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the merge commit: the locks must describe the
          # package.json that the branch will carry.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Regenerate the two kotlin-js-store locks
        run: ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock --stacktrace

      # Staged under one directory so the artifact's layout is the lock paths
      # themselves. The push job checks for exactly these paths.
      - name: Stage the two lock files
        run: |
          set -euo pipefail
          mkdir -p worker-locks/kotlin-js-store/wasm
          cp kotlin-js-store/yarn.lock worker-locks/kotlin-js-store/yarn.lock
          cp kotlin-js-store/wasm/yarn.lock worker-locks/kotlin-js-store/wasm/yarn.lock

      - name: Upload the locks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-locks
          path: worker-locks/
          if-no-files-found: error
          retention-days: 1

  push:
    name: Commit the regenerated locks to the Dependabot branch
    needs: regenerate
    if: >-
      needs.regenerate.result == 'success' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Declared for the reader; the write is made with the App's token below.
      contents: read
    steps:
      - name: Check for the release App
        id: has-app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::RELEASE_APP_ID is not set as a Dependabot secret (Settings > Secrets and variables > Dependabot). Without it the lock cannot be pushed."
            exit 1
          fi

      - name: Mint a release App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          # Only what the push needs, not every permission the installation holds.
          permission-contents: write

      - name: Download the locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-locks
          # Outside the workspace, so nothing from the artifact can land beside
          # the checkout by accident.
          path: ${{ runner.temp }}/worker-locks

      # Checked out after the download so the App token's git credentials are the
      # only thing in the workspace that this job writes. The ref is the PR head the
      # locks were generated from; a push that has moved on is rejected below.
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}

      # Accepts only the two lock files, and only as regular files of sane size
      # whose first lines are yarn's lockfile header. Anything else fails the job
      # before a byte is copied into the checkout.
      - name: Accept only the two lock files
        env:
          SRC: ${{ runner.temp }}/worker-locks
        run: |
          set -euo pipefail
          cd "$SRC"
          if [ -n "$(find . -mindepth 1 ! -type f ! -type d -print)" ]; then
            echo "::error::the artifact holds a link or special file; refusing it"
            exit 1
          fi
          want=$(printf '%s\n' kotlin-js-store/wasm/yarn.lock kotlin-js-store/yarn.lock)
          got=$(find . -type f | sed 's|^\./||' | sort)
          if [ "$got" != "$want" ]; then
            echo "::error::the artifact must hold exactly the two lock files; it holds:"
            echo "$got"
            exit 1
          fi
          for f in $want; do
            size=$(wc -c < "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error::$f is ${size} bytes, over the 1 MiB ceiling"
              exit 1
            fi
            if ! head -n 3 "$f" | grep -qx '# yarn lockfile v1'; then
              echo "::error::$f does not start with yarn's lockfile header"
              exit 1
            fi
          done
          echo "ok: $want"

      - name: Copy the locks into the checkout
        env:
          SRC: ${{ runner.temp }}/worker-locks
        run: |
          set -euo pipefail
          cp "$SRC/kotlin-js-store/yarn.lock" kotlin-js-store/yarn.lock
          cp "$SRC/kotlin-js-store/wasm/yarn.lock" kotlin-js-store/wasm/yarn.lock

      - name: Commit and push to the Dependabot branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- kotlin-js-store)" ]; then
            echo "the locks already match the branch; nothing to push"
            exit 0
          fi
          USER_ID="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"
          git add kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock
          git commit -m "chore(deps): regenerate the web worker's kotlin-js-store locks" \
            -m "Dependabot bumped core/database/src/webWorker/package.json and cannot run Gradle, so the locks were regenerated with kotlinUpgradeYarnLock and kotlinWasmUpgradeYarnLock (#638)."
          # No force: if the branch moved on since the locks were generated, this
          # is rejected and the run for the newer head does the work instead.
          git push origin "HEAD:refs/heads/${HEAD_REF}"

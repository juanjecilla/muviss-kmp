name: Release candidate

# Every push to a release or hotfix branch is a release candidate (ADR 0025):
# tag it vX.Y.Z-rcN, build the signed AAB from that tag, upload it to Play's
# internal track, and publish it as a GitHub pre-release so the exact bundle is
# kept past the 90-day artifact limit. Merging the branch into main later
# promotes the newest RC — release.yml never rebuilds.
#
# The train (release-train.yml) pushes these branches with the release App's
# token, not GITHUB_TOKEN: a push made with GITHUB_TOKEN would not start this
# workflow at all.
on:
  push:
    branches: [ 'release/**', 'hotfix/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Check for the release App
        id: has-app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: echo "ok=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The `v*` tag ruleset lets only admins and the release App create tags.
      - name: Mint a release App token
        id: app
        if: steps.has-app.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      # The notes follow the branch (scripts/release/release-notes.sh): a fix merged
      # into it is in them before the RC is built. When they change, commit them
      # and stop; that push (the release App's) starts the next run, which finds
      # nothing to change and tags the commit that carries them. Text a person
      # wrote is kept. Without the App the push would not start a run, so the
      # notes are left as committed and this run goes on.
      - name: Refresh the release notes
        id: notes
        if: steps.has-app.outputs.ok == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH#*/}"
          scripts/release/release-notes.sh "$VERSION" --write
          if [ -z "$(git status --porcelain fastlane/release-notes)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/release-notes
          git commit -q -m "chore(release): refresh the $VERSION release notes"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "### Release notes refreshed; the next run tags the candidate" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the next release candidate
        id: next
        if: steps.notes.outputs.changed != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH#*/}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::branch '$BRANCH' is not release/X.Y.Z or hotfix/X.Y.Z"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null \
            && { echo "::error::v$VERSION is already released; start a new version"; exit 1; }

          # A re-run on a commit that is already a candidate reuses its tag.
          EXISTING="$(git tag --points-at HEAD -l "v$VERSION-rc*" | sort -V | tail -1)"
          if [ -n "$EXISTING" ]; then
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "HEAD is already $EXISTING"
            exit 0
          fi

          LAST="$(git tag -l "v$VERSION-rc*" | sed -E 's/.*-rc//' | sort -n | tail -1)"
          TAG="v$VERSION-rc$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Muviss $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Release candidate \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/android-release-build.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release_tag: ${{ needs.tag.outputs.tag }}
      upload_internal: true
    secrets: inherit

  prerelease:
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Download the AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muviss-android-${{ needs.tag.outputs.tag }}
          path: artifacts

      - name: Publish the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION%-rc*}"
          {
            echo "Release candidate for Muviss v$VERSION — on Google Play's internal track."
            echo
            echo "The \`.aab\` is the exact bundle uploaded to Play. Merging the release"
            echo "branch into \`main\` promotes the newest candidate to production; it is"
            echo "not rebuilt (ADR 0025)."
            echo
            for f in "fastlane/release-notes/v$VERSION"/*.txt; do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f" .txt)"
              echo
              cat "$f"
              echo
            done
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.aab --clobber
          else
            gh release create "$TAG" --prerelease --verify-tag \
              --title "Muviss $TAG" --notes-file notes.md artifacts/*.aab
          fi

  # The iOS release candidate (WS3, ADR 0033): the same RC, archived and uploaded
  # to TestFlight's internal testers. It needs only the tag, not the Android
  # build, so a failure on either side leaves the other standing. Until the
  # Apple credentials exist (scripts/release/apple-setup.sh) it skips with a
  # notice rather than failing the RC.
  ios:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      # Set only once the TestFlight upload succeeded; `record-testflight` reads it (#604).
      uploaded: ${{ steps.uploaded.outputs.uploaded }}
    steps:
      - name: Check for the Apple credentials
        id: ready
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          missing=()
          [ -n "$APPLE_TEAM_ID" ] || missing+=("vars.APPLE_TEAM_ID")
          [ -n "$ASC_KEY_ID" ] || missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [ -n "$ASC_KEY_P8" ] || missing+=("APP_STORE_CONNECT_KEY_P8")
          if [ "${#missing[@]}" -gt 0 ]; then
            message="iOS is skipped: ${missing[*]} not set (scripts/release/apple-setup.sh)."
            echo "::notice title=iOS skipped::$message"
            {
              echo "### iOS release candidate skipped"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # dSYM upload needs all three; without them the lane skips it.
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "sentry=true" >> "$GITHUB_OUTPUT"
          else
            echo "sentry=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=dSYMs not uploaded::SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT are not all set."
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Full history and the tag: set-version.sh derives CFBundleVersion from
      # `git rev-list --count` and `git describe`, as the Android build does.
      - name: Check out the release candidate
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21 (Corretto)
        if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        if: steps.ready.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The Xcode build runs embedAndSignAppleFrameworkForXcode, a Kotlin/Native
      # link that is the expensive part; the cache is ci.yml's, keyed the same way.
      - name: Cache Kotlin/Native toolchain and compiler caches
        if: steps.ready.outputs.ok == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Set up Ruby
        if: steps.ready.outputs.ok == 'true'
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Install sentry-cli
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.sentry == 'true'
        run: command -v sentry-cli >/dev/null || brew install sentry-cli

      # Archive the RC (cloud-managed signing, App Store export) and upload it to
      # TestFlight. Nothing is submitted for review here.
      - name: Archive and upload to TestFlight (internal)
        if: steps.ready.outputs.ok == 'true'
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Optional: the internal group(s) to distribute to, comma-separated.
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: bundle exec fastlane ios beta

      # Before the dSYM upload, so a Sentry failure after a good upload does not hide it from the record job.
      - name: Note the TestFlight upload
        id: uploaded
        if: steps.ready.outputs.ok == 'true'
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Upload dSYMs to Sentry
        if: steps.ready.outputs.ok == 'true' && steps.ready.outputs.sentry == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: bundle exec fastlane ios upload_dsyms

      - name: Record the candidate
        if: steps.ready.outputs.ok == 'true'
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: echo "### iOS candidate \`$TAG\` uploaded to TestFlight (internal)" >> "$GITHUB_STEP_SUMMARY"

  # Records the TestFlight upload on the release issue's iOS track (#604), so
  # ReleasePromotion#ios_still_ramping? keeps the issue open at Play's 100% while
  # iOS's external-beta step is held. Its own job, with issues: write, so the
  # macOS job's build tooling never holds that token. A failure here does not
  # fail the candidate: the run's conclusion is what release_promote's gates read
  # (ADR 0030), and a marker write must not hold Play. The marker then keeps
  # today's behaviour, which is the only cost.
  record-testflight:
    needs: [tag, ios]
    if: always() && needs.tag.outputs.tag != '' && needs.ios.outputs.uploaded == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0

      - name: Record the TestFlight upload on the release issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: ruby fastlane/release_promote.rb record-testflight "$TAG"

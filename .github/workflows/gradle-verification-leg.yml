name: Gradle verification metadata (one OS)

# One leg of gradle-verification.yml: regenerates gradle/verification-metadata.xml on one
# host and hands the file to the next leg (or to the push job) as an artifact. It holds
# NO secrets and read-only permissions, because it runs the branch's build, and a Gradle
# plugin or dependency in that build can execute anything it likes (#497's review).
on:
  workflow_call:
    inputs:
      os:
        description: Runner image for this leg.
        required: true
        type: string
      ref:
        description: Branch the legs regenerate for.
        required: true
        type: string
      sha:
        description: Commit to build. Empty on the first leg, which pins the head for the others.
        required: false
        type: string
        default: ''
      previous:
        description: The previous leg's os, whose metadata this leg starts from. Empty on the first leg.
        required: false
        type: string
        default: ''
    outputs:
      sha:
        description: The commit this leg built.
        value: ${{ jobs.regenerate.outputs.sha }}

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate checksums (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.ref }}
          # versionCode is a commit count; a shallow clone fails the build on purpose.
          fetch-depth: 0
          persist-credentials: false

      - name: Record the commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Start from what the hosts before this one added, so Gradle keeps their entries.
      - name: Download the previous leg's metadata
        if: inputs.previous != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata-${{ inputs.previous }}
          path: ${{ runner.temp }}/previous

      - name: Use the previous leg's metadata
        if: inputs.previous != ''
        run: cp "$RUNNER_TEMP/previous/verification-metadata.xml" gradle/verification-metadata.xml

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Regenerate gradle/verification-metadata.xml
        run: scripts/gradle/update-verification.sh

      - name: Upload this leg's metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata-${{ inputs.os }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

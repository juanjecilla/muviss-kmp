name: Deploy landing (GitHub Pages)

# Builds the Astro landing in website/ and deploys it to GitHub Pages at
# muvissapp.com (website/public/CNAME). See docs/RELEASING.md §10.
#
# The Wasm web app used to deploy from here. It moves to app.muvissapp.com
# instead — one repo's Pages site carries one custom domain, and the landing
# owns this one — and is not hosted anywhere until that lands (#167).
#
# Pages cannot be enabled while the repo is private on the free plan (422
# "Your current plan does not support GitHub Pages for this repository"), and
# Actions are refused for billing (#66). Until the public flip (#81) this
# workflow will fail; nothing else depends on it.
on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - 'docs/PRIVACY.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: { }

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # Renders docs/PRIVACY.md into /privacy, so the checkout must include docs/.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Android release build

# The signed AAB, built once per release candidate (ADR 0025). Called by
# release-rc.yml (with the Play upload) and by release.yml's dispatch path
# (without it). Production never rebuilds: release.yml promotes the RC that
# testers had and attaches that same AAB to the GitHub Release.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (an rc tag, or a branch on dispatch)'
        type: string
        required: true
      release_tag:
        description: 'vX.Y.Z-rcN — names the artifact and selects the release notes'
        type: string
        required: true
      upload_internal:
        description: 'Upload the AAB to the Play internal track'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history + tags: versionCode/versionName are derived from
          # `git rev-list --count` / `git describe` (see
          # app/androidApp/build.gradle.kts) and need real git metadata,
          # not the single commit a shallow checkout would give us.
          fetch-depth: 0

      # The JDK gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # (Corretto 21), as JAVA_HOME: Gradle then runs the daemon on it as-is
      # instead of downloading one through foojay, whose package IDs are retired
      # when Corretto updates and then answer 400 (2026-10-06). The daemon was
      # already this JDK — that download is where it came from — so builds,
      # tests and the desktop runtime image are unchanged.
      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Optional: both features degrade gracefully to no-op when their
          # secret isn't configured (see ADR 0007 / docs/RELEASING.md).
          #
          # SYNC_ENABLED, SYNC_ENTITLEMENT_OVERRIDE, SUPABASE_URL and
          # SUPABASE_ANON_KEY are deliberately absent, and that absence IS the
          # production gate (ADR 0018): without them `SyncAvailability` reports
          # unconfigured, `NoOpSyncBackend` is bound, and the profile screen
          # renders no sync row at all. Do not add them here until sync has
          # been verified against a live project and the privacy/data-safety
          # docs describe library data leaving the device.
          # The v4 read token keeps the credential out of request URLs and wins
          # when set; the v3 key is the fallback (CLAUDE.md, #91, #197).
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Sentry Gradle plugin (:app:androidApp/build.gradle.kts): uploads the
          # R8 mapping only when all three of these are set, and does nothing —
          # no upload, no network — otherwise (#110). SENTRY_ENVIRONMENT is
          # pinned explicitly rather than left to app/shared/build.gradle.kts's
          # task-name heuristic, which is a default, not a guarantee.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_ENVIRONMENT: production
        run: ./gradlew :app:androidApp:bundleRelease :app:androidApp:verifyReleaseBundleComposeResources --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: muviss-android-${{ inputs.release_tag }}
          path: app/androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Skipped while the service-account secret is missing, so the job stays
      # green before the owner has created it (scripts/release/owner-setup.sh).
      - name: Set up Ruby
        if: inputs.upload_internal
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Upload to Google Play (internal track)
        if: inputs.upload_internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          # `draft` until the app's first production release exists; Play
          # refuses any other status on a never-published app. Set the repo
          # variable to `completed` after that.
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload."
            exit 0
          fi
          bundle exec fastlane android internal

name: Bug
description: Something in the app or the landing doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Search
        2. …
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, iOS, macOS, Windows, Linux, Web, Landing (muvissapp.com)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove anything personal. Never paste an API key or a TMDB request URL — the v3 key rides in it.

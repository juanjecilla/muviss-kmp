#Kotlin
kotlin.code.style=official
# 3G was not enough for Kotlin/Native's release LTO: the devirtualization
# analysis in `linkReleaseFrameworkIosArm64` died with
# `e: Compilation failed: Java heap space`. The K/N compiler runs inside the
# Kotlin daemon, so this is the knob that governs it.
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Kotlin 2.4 Wasm/JS incremental compilation corrupts its own cache and fails
# an arbitrary, unrelated module with an internal compiler error naming a
# stdlib symbol (e.g. "Key ic#...kotlin.text/indexOf... is missing in the
# map."). Verified clean with incremental compilation off; see #131 before
# removing this once upstream is fixed or a Kotlin version bump resolves it.
kotlin.incremental.wasm=false
kotlin.incremental.js=false

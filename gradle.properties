#Kotlin
kotlin.code.style=official
# 3G was not enough for Kotlin/Native's release LTO: the devirtualization
# analysis in `linkReleaseFrameworkIosArm64` died with
# `e: Compilation failed: Java heap space`. The K/N compiler runs inside the
# Kotlin daemon, so this is the knob that governs it.
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
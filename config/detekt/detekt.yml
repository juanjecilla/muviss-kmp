## Muviss Detekt config — overrides on top of buildUponDefaultConfig.

complexity:
  LongMethod:
    active: false
  LongParameterList:
    # @Composable components legitimately take many optional styling/variant
    # params (rating, progress, selected…) — Compose's own components do too.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false

style:
  MagicNumber:
    # Compose dp/sp literals and TMDB constants are readable inline.
    active: false
  UnusedPrivateMember:
    active: true
  ReturnCount:
    active: false
  MaxLineLength:
    active: false

naming:
  FunctionNaming:
    # @Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']
    # Detekt's default excludes list the test source sets it knew about, which
    # does not include Kotlin Multiplatform's intermediate ones — `webTest` was
    # added by EPIC 24 and immediately tripped this rule, while the identical
    # `underscore_case` naming in `commonTest` and `jvmTest` passed. Restated in
    # full rather than appended to, since a YAML key replaces rather than
    # extends. Test names are sentences here on purpose: `commonTest` uses
    # underscores because Kotlin/Native rejects punctuation in backticked names
    # (see CLAUDE.md), so the whole repo follows suit for consistency.
    excludes: [
      '**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**',
      '**/androidUnitTest/**', '**/androidInstrumentedTest/**',
      '**/jsTest/**', '**/iosTest/**', '**/webTest/**', '**/nativeTest/**',
      '**/appleTest/**', '**/jsBrowserTest/**', '**/wasmJsTest/**',
      '**/wasmJsBrowserTest/**',
    ]
  MatchingDeclarationName:
    # expect/actual files are platform-suffixed (Foo.android.kt) and some files
    # group related declarations; enforced loosely via review instead.
    active: false

# Compose ruleset (io.nlopez.compose.rules)
Compose:
  ComposableParamOrder:
    active: false
  ModifierMissing:
    active: false
  ModifierNotUsedAtRoot:
    active: false

# Our own ruleset (:detekt-rules) — see its build.gradle.kts.
muviss:
  ForbiddenViewModelScopeLaunch:
    active: true
  # EPIC 31 (#74): UI copy lives in composeResources, not in literals. The
  # excludes are the modules not migrated yet — a ratchet: each migration PR
  # deletes its own line, and nothing is ever added back.
  HardcodedUiCopy:
    active: true
    includes: ['**/commonMain/**']
    excludes: [
      '**/feature/profile/ui/**',
      '**/feature/settings/ui/**',
      '**/feature/triage/ui/**',
    ]

<!--
  Sign-in code for an existing Muviss account (GoTrue's "Magic Link"
  template, which is what POST /auth/v1/otp sends when the address already
  has a user).

  {{ .Token }}, not {{ .ConfirmationURL }}. The stock template renders a
  clickable link, and Muviss's profile screen asks for a six-digit code —
  so with the default in place there is nothing in the email to type, and
  the link lands on whatever site_url is configured rather than in the app.
  ADR 0009 chose the typed-code flow deliberately; this template is what
  makes the server agree with it.
-->
<h2>Your Muviss sign-in code</h2>

<p>Enter this code in the app to finish signing in:</p>

<p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 24px 0;">
  {{ .Token }}
</p>

<p>The code expires in an hour. If you didn't ask to sign in, ignore this email — nothing has changed on your account.</p>
